[Settings]
# Signaling (control) port
listening_port=40000

# Relay (data) port: client frames travel through this UDP port
relay_port=40001

# Act as gateway on 10.0.0.1 (opens the TAP adapter on the server)
tap_gateway=1

# NAT the virtual network to the internet (admin + WinNat required)
nat=0

# Local Area IP the server binds to (example: 192.168.1.101).
# Empty = listen on every interface (0.0.0.0). Relay + signaling use it.
local_ip=

# ARPA root service: name -> virtual IP records (separate domain.db)
# Virtual IP pool base / gateway (example: 192.168.1.1 to start there)
gateway_ip=10.0.0.1
